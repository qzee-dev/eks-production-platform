apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: application
spec:
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias | quote }}
  role: {{ .Values.nodeRole | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Environment: {{ .Values.environment | quote }}
    Project: {{ .Values.project | quote }}
    Owner: {{ .Values.owner | quote }}
    CostCenter: {{ .Values.costCenter | quote }}
    ManagedBy: Terraform
