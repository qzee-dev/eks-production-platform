apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: applications
spec:
  template:
    metadata:
      labels:
        platform.myapp.io/pool: application
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: application
      taints:
        - key: platform.myapp.io/workload
          value: application
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            {{- range .Values.zones }}
            - {{ . | quote }}
            {{- end }}
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
            - r
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
            - "4"
      expireAfter: 720h
      terminationGracePeriod: 2h
  limits:
    cpu: {{ .Values.cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      - nodes: "10%"
