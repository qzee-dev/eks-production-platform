{{- range .Values.namespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . | quote }}
  labels:
    app.kubernetes.io/managed-by: Helm
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: {{ printf "v%s" $.Values.kubernetesVersion | quote }}
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: {{ printf "v%s" $.Values.kubernetesVersion | quote }}
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: {{ printf "v%s" $.Values.kubernetesVersion | quote }}
---
{{- end }}
