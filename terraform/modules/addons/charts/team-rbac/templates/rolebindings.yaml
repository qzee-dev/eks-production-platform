{{- range .Values.devopsNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-devops
  namespace: {{ . | quote }}
subjects:
  - kind: Group
    name: eks:devops
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: platform-devops
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- range .Values.developerNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-developers
  namespace: {{ . | quote }}
subjects:
  - kind: Group
    name: eks:developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: platform-developer
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- range .Values.readOnlyNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-read-only
  namespace: {{ . | quote }}
subjects:
  - kind: Group
    name: eks:read-only
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: platform-read-only
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
